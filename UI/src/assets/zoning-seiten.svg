<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 124" width="150" height="124">
  <!-- Boden ausserhalb -->
  <rect x="0" y="0" width="150" height="124" rx="4" fill="#26352a"/>
  <!-- Parkplatz: Asphalt, blauer Umriss, Buchtreihe unten -->
  <rect x="6" y="6" width="138" height="112" fill="#4d5359" stroke="#4fc3f7" stroke-width="1.6"/>
  <g stroke="#ffffff" stroke-opacity="0.75" stroke-width="1">
    <path d="M6 100h138"/>
    <path d="M16 100v18M26 100v18M36 100v18M46 100v18M56 100v18M66 100v18M76 100v18M86 100v18M96 100v18M106 100v18M116 100v18M126 100v18M136 100v18"/>
  </g>
  <!-- Aussenband vor der angeklickten Seite (kommt dazu) -->
  <g fill="#9eb0e8" fill-opacity="0.18" stroke="#9eb0e8" stroke-width="1.2" stroke-dasharray="3 2">
    <rect x="34" y="12" width="20" height="16"/><rect x="56" y="12" width="20" height="16"/><rect x="78" y="12" width="20" height="16"/><rect x="100" y="12" width="20" height="16"/>
  </g>
  <!-- Zoningstrasse rund um die Flaeche -->
  <rect x="34" y="34" width="86" height="54" fill="none" stroke="#30353a" stroke-width="10"/>
  <rect x="34" y="34" width="86" height="54" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="5 4"/>
  <!-- die angeklickte Aussenseite -->
  <path d="M29 29h96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Zoningflaeche (Bauland) innen -->
  <g fill="#9eb0e8" fill-opacity="0.45" stroke="#9eb0e8" stroke-width="1.2">
    <rect x="40" y="40" width="18" height="20"/><rect x="59" y="40" width="18" height="20"/><rect x="78" y="40" width="18" height="20"/><rect x="97" y="40" width="17" height="20"/>
    <rect x="40" y="62" width="18" height="20"/><rect x="59" y="62" width="18" height="20"/><rect x="78" y="62" width="18" height="20"/><rect x="97" y="62" width="17" height="20"/>
  </g>
  <!-- Mauszeiger auf der Aussenseite -->
  <path d="M104 29v18l4.5-4.5 3.5 7.4 3-1.4-3.4-7.4h6.4z" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
