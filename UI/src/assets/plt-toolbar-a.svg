<!-- translate GLEICHT DIE DREHUNG AUS.
     Die 10 Grad schieben die Umrandung schraeg aus dem Quadrat: ohne
     Ausgleich blieben oben 4,30 und unten nur 1,49 Einheiten Rand, das
     Logo sass also sichtbar zu tief und zu weit rechts. Gerechnet aus
     der gedrehten Umrandung des Inhalts (Fuellpfade 10..58 / 8..30,
     Rahmenpfade 10..54 / 35..57 zuzueglich 1,4 Strichhaelfte).
     Reihenfolge beachten: SVG wendet rechts zuerst an, also erst
     drehen, dann verschieben. -->
